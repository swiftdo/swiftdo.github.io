  <line x1="32" y1="258" x2="648" y2="258" stroke="#e3e1db" stroke-width="1"/>
  <text class="t note" x="32" y="282">0.1.0 走到 rc.8，0.2.1 走到 rc.5 —— 这个仓库不忌讳把候选版排到第五个以后。</text>
  <text class="t note" x="32" y="304" fill="#6f7480">所以 rc.3 之后再出一个 rc.4，比「它就是最终版」更符合它过去 88 天的习惯。</text>
