    <circle cx="146" cy="100" r="4.5" fill="#b4543c"/><text class="t mo" x="156" y="104">npm latest 实际指向的版本</text>
  </g>

  <line x1="48" y1="180" x2="632" y2="180" stroke="#dcd9d1" stroke-width="1"/>

