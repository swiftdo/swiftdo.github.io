<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 322" width="680" height="322" role="img" aria-labelledby="d3s5-t d3s5-d">
  <title id="d3s5-t">DeepSeek Harness 自 8 月 17 日以来的 39 个发布</title>
  <desc id="d3s5-d">从 2026 年 8 月 17 日到 11 月 13 日共 88 天，发布 39 个版本，全部标记为 pre-release，没有一个正式版。npm 的 latest 标签仍停在 11 月 4 日的 0.2.2-rc.1，最新版本 0.2.2-rc.3 挂在 next 标签下。</desc>
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hd { fill: #23262e; font-size: 21px; font-weight: 700; }
      .sub { fill: #6f7480; font-size: 12px; }
      .lab { fill: #8b8f9a; font-size: 10px; letter-spacing: 1px; }
      .mo { fill: #8b8f9a; font-size: 10px; }
      .note { fill: #52565f; font-size: 11px; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="322" fill="#f7f7f5"/>

  <text class="serif hd" x="32" y="44">88 天，39 个版本，0 个正式版</text>
  <text class="t sub" x="32" y="68">从 8 月 17 日第一个 GitHub Release 算起；每个点是一次发布，全部标着 Pre-release</text>

