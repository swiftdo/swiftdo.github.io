<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 458" width="680" height="458" role="img" aria-labelledby="ocrb-t ocrb-d">
  <title id="ocrb-t">同一模型下 Open Code Review 与 Claude Code 的评审指标对比</title>
  <desc id="ocrb-d">在 AACR-Bench 上使用同一个 Claude-4.6-Opus 模型，Open Code Review 的 F1 为 25.10%、精确率 33.90%、召回率 20.00%，每次评审约 38.5 万 token、耗时 1 分 23 秒；Claude Code 的 F1 为 11.57%、精确率 7.23%、召回率 28.90%，每次约 566 万 token、耗时 13 分 6 秒。只有召回率一项 Claude Code 更高，代价是报出 5980 条评论。</desc>
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
      .hd { fill: #23262e; font-size: 21px; font-weight: 700; }
      .sub { fill: #6f7480; font-size: 12px; }
      .met { fill: #23262e; font-size: 12.5px; font-weight: 600; }
      .metd { fill: #8b8f9a; font-size: 10px; }
      .val { fill: #23262e; font-size: 11px; font-weight: 600; }
      .vald { fill: #8b8f9a; font-size: 11px; font-weight: 600; }
      .big { font-size: 26px; font-weight: 700; }
      .sm { fill: #8b8f9a; font-size: 10px; letter-spacing: 0.8px; }
      .note { fill: #6f7480; font-size: 10.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="458" fill="#f7f7f5"/>

  <text class="serif hd" x="32" y="42">同一个模型，两种架构</text>
  <text class="t sub" x="32" y="66">AACR-Bench：50 个开源仓库 / 200 个真实 PR / 10 种语言 / 1,505 条人工标注 ｜ 均为 Claude-4.6-Opus</text>

  <rect x="32" y="84" width="10" height="10" fill="#2f7d5b"/>
  <text class="t note" x="48" y="93">Open Code Review v1.3.1</text>
  <rect x="220" y="84" width="10" height="10" fill="#b9bcc4"/>
  <text class="t note" x="236" y="93">Claude Code v2.1.169</text>

  <!-- F1 -->
  <text class="t met" x="32" y="136">F1</text>
  <text class="t metd" x="32" y="150">整体质量</text>
  <rect x="150" y="124" width="238" height="13" fill="#2f7d5b"/>
  <text class="t val" x="396" y="135">25.1%</text>
  <rect x="150" y="143" width="110" height="13" fill="#b9bcc4"/>
  <text class="t vald" x="268" y="154">11.6%</text>

  <!-- Precision -->
  <text class="t met" x="32" y="196">Precision</text>
  <text class="t metd" x="32" y="210">报出来的有多准</text>
  <rect x="150" y="184" width="322" height="13" fill="#2f7d5b"/>
  <text class="t val" x="480" y="195">33.9%</text>
  <rect x="150" y="203" width="69" height="13" fill="#b9bcc4"/>
  <text class="t vald" x="227" y="214">7.2%</text>

  <!-- Recall -->
  <text class="t met" x="32" y="256">Recall</text>
  <text class="t metd" x="32" y="270">真问题找到多少</text>
  <rect x="150" y="244" width="190" height="13" fill="#2f7d5b"/>
  <text class="t val" x="348" y="255">20.0%</text>
  <rect x="150" y="263" width="275" height="13" fill="#b9bcc4"/>
  <text class="t vald" x="433" y="274">28.9%</text>

  <text class="t note" x="32" y="294">刻度 0–40%。只有召回率一行，通用 Agent 领先。</text>

  <!-- 成本 -->
  <rect x="32" y="312" width="302" height="106" rx="5" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
  <text class="t sm" x="48" y="334">平均 TOKEN / 次评审</text>
  <text class="t big" x="48" y="370" fill="#2f7d5b">385K</text>
  <text class="t big" x="48" y="400" fill="#b9bcc4">5,664K</text>
  <text class="t sm" x="316" y="334" text-anchor="end" fill="#b4543c">14.7 倍</text>
  <text class="t metd" x="250" y="370">OCR</text>
  <text class="t metd" x="250" y="400">Claude Code</text>

  <rect x="346" y="312" width="302" height="106" rx="5" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
  <text class="t sm" x="362" y="334">平均耗时 / 次评审</text>
  <text class="t big" x="362" y="370" fill="#2f7d5b">1m23s</text>
  <text class="t big" x="362" y="400" fill="#b9bcc4">13m6s</text>
  <text class="t sm" x="630" y="334" text-anchor="end" fill="#b4543c">9.4 倍</text>

  <text class="t note" x="32" y="440">数据取自 open-codereview.ai 首页公开榜单，2026-11-15 抓取。两个版本号不同，非同一次运行。</text>
</svg>
