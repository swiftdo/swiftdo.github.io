<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" width="680" height="428" role="img" aria-labelledby="d2s1-t d2s1-d">
  <title id="d2s1-t">0.2.2-rc.2 的 76 条变更按性质分层</title>
  <desc id="d2s1-d">本版共 76 条面向用户的变更：只有 3 条是新增能力，53 条是体验优化与问题修复，20 条是默认值、迁移与权限边界调整。唯一会删掉本地目录的默认值变更落在第三类里。</desc>
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hd { fill: #23262e; font-size: 21px; font-weight: 700; }
      .sub { fill: #6f7480; font-size: 12px; }
      .lab { fill: #8b8f9a; font-size: 10px; letter-spacing: 1px; }
      .cnt { font-size: 30px; font-weight: 700; }
      .li { fill: #52565f; font-size: 11.5px; }
      .tick { fill: #8b8f9a; font-size: 11px; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="428" fill="#f7f7f5"/>

  <text class="serif hd" x="32" y="44">76 条变更，只有 3 条是新能力</text>
  <text class="t sub" x="32" y="68">dsh-v0.2.2-rc.2 ｜ 2026-11-11 19:33（UTC+8）｜ 基线 v0.2.2-rc.1，间隔 7 天</text>

  <text class="t lab" x="32" y="102">新增</text>
  <text class="t lab" x="271" y="102" text-anchor="middle">体验优化 + 问题修复</text>
  <text class="t lab" x="567" y="102" text-anchor="middle">其他变更</text>

  <rect x="32" y="112" width="24" height="14" fill="#2f7d5b"/>
  <rect x="56" y="112" width="430" height="14" fill="#a8adb8"/>
  <rect x="486" y="112" width="162" height="14" fill="#b4543c"/>

  <g>
    <rect x="32" y="148" width="196" height="206" rx="6" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t lab" x="48" y="172" fill="#2f7d5b">NEW · 新能力</text>
    <text class="serif cnt" x="48" y="212" fill="#2f7d5b">3</text>
    <line x1="48" y1="228" x2="212" y2="228" stroke="#cfe0d6" stroke-width="1"/>
    <circle cx="52" cy="248" r="2" fill="#2f7d5b"/>
    <text class="t li" x="62" y="252">Git Worktree 审 PR</text>
    <circle cx="52" cy="274" r="2" fill="#2f7d5b"/>
    <text class="t li" x="62" y="278">SubAgent 具名多层</text>
    <circle cx="52" cy="300" r="2" fill="#2f7d5b"/>
    <text class="t li" x="62" y="304">桌面双更新通道</text>
  </g>

  <g>
    <rect x="242" y="148" width="196" height="206" rx="6" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
    <text class="t lab" x="258" y="172">27 + 26 · 手感</text>
    <text class="serif cnt" x="258" y="212" fill="#23262e">53</text>
    <line x1="258" y1="228" x2="422" y2="228" stroke="#e6e6ea" stroke-width="1"/>
    <circle cx="262" cy="248" r="2" fill="#8b8f9a"/>
    <text class="t li" x="272" y="252">重试与继续生成</text>
    <circle cx="262" cy="274" r="2" fill="#8b8f9a"/>
    <text class="t li" x="272" y="278">滚动加载更早消息</text>
    <circle cx="262" cy="300" r="2" fill="#8b8f9a"/>
    <text class="t li" x="272" y="304">diff 增删行着色</text>
    <text class="t tick" x="272" y="332">多数是「本该如此」</text>
  </g>

  <g>
    <rect x="452" y="148" width="196" height="206" rx="6" fill="#fbf5f2" stroke="#b4543c" stroke-width="1"/>
    <text class="t lab" x="468" y="172" fill="#b4543c">DEFAULTS · 默认值与边界</text>
    <text class="serif cnt" x="468" y="212" fill="#b4543c">20</text>
    <line x1="468" y1="228" x2="632" y2="228" stroke="#e8d5cd" stroke-width="1"/>
    <circle cx="472" cy="248" r="2" fill="#b4543c"/>
    <text class="t li" x="482" y="252">默认值调整</text>
    <circle cx="472" cy="274" r="2" fill="#b4543c"/>
    <text class="t li" x="482" y="278">迁移清单</text>
    <circle cx="472" cy="300" r="2" fill="#b4543c"/>
    <text class="t li" x="482" y="304">权限边界</text>
    <text class="t tick" x="482" y="332" fill="#b4543c">含「删本地目录」</text>
  </g>

  <text class="t sub" x="32" y="386" font-size="12.5">判断这次升级要不要动手，看的不是左边那 3 条，</text>
  <text class="t sub" x="32" y="406" font-size="12.5" fill="#b4543c">而是右边这 20 条——归档会话现在会顺手清掉 Git 工作树。</text>
</svg>
