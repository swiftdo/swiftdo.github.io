<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 512" width="680" height="512" role="img" aria-labelledby="ocrp-t ocrp-d">
  <title id="ocrp-t">一次 ocr review 的流水线：确定性工程包住中间的 Agent 阶段</title>
  <desc id="ocrp-d">流水线分三段：前置工程用代码完成 diff 提取、文件过滤、语义分组与规则路由，其中模型不参与；中段每组变更启动一个子 Agent，按 plan 与 main loop 反复调用工具产出评论；后段由评论工作池做行号解析、重定位兜底与反思过滤，其中重定位与反思会再次调用模型。</desc>
  <defs>
    <style>
      .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .hd { fill: #23262e; font-size: 21px; font-weight: 700; }
      .sub { fill: #6f7480; font-size: 12px; }
      .stage { fill: #8b8f9a; font-size: 10px; letter-spacing: 1.4px; }
      .bt { fill: #23262e; font-size: 12px; font-weight: 600; }
      .bd { fill: #6f7480; font-size: 10.5px; }
      .note { fill: #8b8f9a; font-size: 10.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="512" fill="#f7f7f5"/>

  <text class="serif hd" x="32" y="42">模型只碰中间那一层</text>
  <text class="t sub" x="32" y="66">一次 ocr review 的调度路径 ｜ 绿框为确定性代码，暖框为 LLM 调用</text>

  <rect x="32" y="86" width="10" height="10" fill="#ffffff" stroke="#2f7d5b" stroke-width="1.5"/>
  <text class="t note" x="48" y="95">确定性工程</text>
  <rect x="150" y="86" width="10" height="10" fill="#fbf5f2" stroke="#b4543c" stroke-width="1.5"/>
  <text class="t note" x="166" y="95">模型调用</text>

  <!-- 阶段 1 -->
  <text class="t stage" x="32" y="128">① 前置：全部由代码判定</text>
  <g>
    <rect x="32" y="138" width="142" height="48" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t bt" x="44" y="158">git diff</text>
    <text class="t bd" x="44" y="174">工作区 / 分支 / commit</text>
  </g>
  <g>
    <rect x="190" y="138" width="142" height="48" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t bt" x="202" y="158">文件过滤</text>
    <text class="t bd" x="202" y="174">默认排除测试与生成代码</text>
  </g>
  <g>
    <rect x="348" y="138" width="142" height="48" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t bt" x="360" y="158">语义分组</text>
    <text class="t bd" x="360" y="174">中英 properties 同包</text>
  </g>
  <g>
    <rect x="506" y="138" width="142" height="48" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t bt" x="518" y="158">规则路由</text>
    <text class="t bd" x="518" y="174">四层优先级取首个命中</text>
  </g>
  <line x1="174" y1="162" x2="188" y2="162" stroke="#b9bcc4" stroke-width="1"/>
  <line x1="332" y1="162" x2="346" y2="162" stroke="#b9bcc4" stroke-width="1"/>
  <line x1="490" y1="162" x2="504" y2="162" stroke="#b9bcc4" stroke-width="1"/>

  <!-- 阶段 2 -->
  <text class="t stage" x="32" y="216">② 每组一个子 Agent，并发上限默认 8</text>
  <rect x="32" y="226" width="616" height="104" rx="6" fill="#fbf5f2" stroke="#b4543c" stroke-width="1"/>
  <g>
    <rect x="52" y="250" width="150" height="52" rx="4" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
    <text class="t bt" x="64" y="270">plan</text>
    <text class="t bd" x="64" y="288">列出要查的点</text>
  </g>
  <g>
    <rect x="222" y="250" width="190" height="52" rx="4" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
    <text class="t bt" x="234" y="270">main loop ×1/2/3</text>
    <text class="t bd" x="234" y="288">轮数由 --effort 决定</text>
  </g>
  <g>
    <rect x="432" y="250" width="196" height="52" rx="4" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
    <text class="t bt" x="444" y="270">code_comment</text>
    <text class="t bd" x="444" y="288">带 existing_code 的评论</text>
  </g>
  <line x1="202" y1="276" x2="220" y2="276" stroke="#b9bcc4" stroke-width="1"/>
  <line x1="412" y1="276" x2="430" y2="276" stroke="#b9bcc4" stroke-width="1"/>
  <text class="t note" x="52" y="320">工具只有几个：file_read、code_search 等，从生产调用轨迹里蒸馏而来</text>

  <!-- 阶段 3 -->
  <text class="t stage" x="32" y="356">③ 后处理：评论落位与自我否定</text>
  <g>
    <rect x="32" y="366" width="142" height="52" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t bt" x="44" y="386">评论工作池</text>
    <text class="t bd" x="44" y="402">不阻塞主循环</text>
  </g>
  <g>
    <rect x="190" y="366" width="142" height="52" rx="4" fill="#ffffff" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t bt" x="202" y="386">行号解析</text>
    <text class="t bd" x="202" y="402">滑动窗口比对 diff</text>
  </g>
  <g>
    <rect x="348" y="366" width="142" height="52" rx="4" fill="#fbf5f2" stroke="#b4543c" stroke-width="1"/>
    <text class="t bt" x="360" y="386">重定位兜底</text>
    <text class="t bd" x="360" y="402">匹配失败才问模型</text>
  </g>
  <g>
    <rect x="506" y="366" width="142" height="52" rx="4" fill="#fbf5f2" stroke="#b4543c" stroke-width="1"/>
    <text class="t bt" x="518" y="386">反思过滤</text>
    <text class="t bd" x="518" y="402">删掉站不住的结论</text>
  </g>
  <line x1="174" y1="392" x2="188" y2="392" stroke="#b9bcc4" stroke-width="1"/>
  <line x1="332" y1="392" x2="346" y2="392" stroke="#b9bcc4" stroke-width="1"/>
  <line x1="490" y1="392" x2="504" y2="392" stroke="#b9bcc4" stroke-width="1"/>

  <text class="t note" x="32" y="452">落不到行的评论，起始行记为 0——下游据此判定「需人工定位」</text>
  <text class="t sub" x="32" y="482" fill="#52565f">交给模型的只有三件事：读代码、判断风险、写结论。</text>
</svg>
