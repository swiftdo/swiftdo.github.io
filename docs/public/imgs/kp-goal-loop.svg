<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 428" width="680" height="428" role="img" aria-labelledby="kpg-title kpg-desc">
  <title id="kpg-title">命令式指令与目标驱动执行的对比</title>
  <desc id="kpg-desc">左边是模糊的命令式任务，没有可判定的终点；右边把同一个任务翻译成带验证点的成功标准，每一步独立验证，失败就回到上一步循环，最终以测试全绿收尾。</desc>
  <defs>
    <marker id="kpg-arw" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b8f9a"/>
    </marker>
    <marker id="kpg-arw-g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2f7d5b"/>
    </marker>
    <style>
      .t { font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", serif; }
      .hd { fill: #23262e; font-size: 21px; font-weight: 700; }
      .sub { fill: #6f7480; font-size: 12px; }
      .lab { fill: #8b8f9a; font-size: 10px; letter-spacing: 1px; }
      .big { fill: #23262e; font-size: 15px; font-weight: 700; }
      .li { fill: #52565f; font-size: 12px; }
      .vf { fill: #2f7d5b; font-size: 11.5px; }
      .warn { fill: #b4543c; font-size: 11.5px; }
      .pair { fill: #3a3d45; font-size: 11.5px; }
    </style>
  </defs>

  <rect x="0" y="0" width="680" height="428" fill="#f7f7f5"/>

  <text class="serif hd" x="32" y="46">别告诉它做什么，告诉它「什么叫做完」</text>
  <text class="t sub" x="32" y="70">Karpathy：LLM 极擅长循环执行直到达成具体目标 —— 给它成功标准，别给它步骤</text>

  <g>
    <rect x="32" y="96" width="268" height="196" rx="6" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
    <text class="t lab" x="48" y="120">IMPERATIVE · 弱标准</text>
    <text class="t big" x="48" y="146">“修好认证系统”</text>
    <line x1="48" y1="160" x2="284" y2="160" stroke="#e6e6ea" stroke-width="1"/>
    <text class="t li" x="48" y="182">1. Reviewing the code</text>
    <text class="t li" x="48" y="204">2. Identifying issues</text>
    <text class="t li" x="48" y="226">3. Making improvements</text>
    <text class="t li" x="48" y="248">4. Testing the changes</text>
    <line x1="48" y1="262" x2="284" y2="262" stroke="#e6e6ea" stroke-width="1"/>
    <text class="t warn" x="48" y="282">没有可判定的终点 → 只能靠人反复确认</text>
  </g>

  <line x1="304" y1="194" x2="372" y2="194" stroke="#8b8f9a" stroke-width="1" marker-end="url(#kpg-arw)"/>
  <text class="t lab" x="304" y="182">翻译</text>

  <g>
    <rect x="380" y="96" width="268" height="196" rx="6" fill="#f3f8f5" stroke="#2f7d5b" stroke-width="1"/>
    <text class="t lab" x="396" y="120" fill="#2f7d5b">DECLARATIVE · 强标准</text>
    <text class="t big" x="396" y="146">“写复现测试 → 让它通过”</text>
    <line x1="396" y1="160" x2="632" y2="160" stroke="#cfe0d6" stroke-width="1"/>
    <text class="t li" x="396" y="182">1 写测试：改密码后旧会话失效</text>
    <text class="t vf" x="396" y="200">　 verify：测试先失败，复现了 bug</text>
    <text class="t li" x="396" y="222">2 改实现：改密码时作废会话</text>
    <text class="t vf" x="396" y="240">　 verify：测试通过</text>
    <text class="t li" x="396" y="262">3 跑全量 auth 测试</text>
    <text class="t vf" x="396" y="280">　 verify：全绿，无回归</text>
  </g>

  <g>
    <rect x="32" y="312" width="616" height="92" rx="6" fill="#ffffff" stroke="#dcdde2" stroke-width="1"/>
    <text class="t lab" x="48" y="334">三种常见改写 · CLAUDE.md 原文　｜　任一 verify 失败 → 回到该步重做，直到全绿</text>
    <text class="mono pair" x="48" y="356">"Add validation"  →  "Write tests for invalid inputs, then make them pass"</text>
    <text class="mono pair" x="48" y="376">"Fix the bug"      →  "Write a test that reproduces it, then make it pass"</text>
    <text class="mono pair" x="48" y="396">"Refactor X"       →  "Ensure tests pass before and after"</text>
  </g>
</svg>
